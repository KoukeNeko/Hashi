# ==============================================================================
# Hashi Backend - Build Linux Packages
# ==============================================================================
# 自動建置 Linux 安裝包 (DEB + RPM) 的 GitHub Actions workflow
# 支援架構：amd64, arm64
# 觸發條件：push 到任何分支、tag、手動觸發
# ==============================================================================

name: Build Linux Packages

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
    paths:
      - "backend/**"
      - ".github/workflows/build-deb.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版本號 (例如: 1.0.0)"
        required: false
        default: "0.0.1"

jobs:
  # ===========================================================================
  # Build JAR (架構無關，只需建置一次)
  # ===========================================================================
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      jar_name: ${{ steps.prepare.outputs.jar_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build JAR with Gradle
        working-directory: backend
        run: ./gradlew clean bootJar

      - name: Determine version and JAR name
        id: prepare
        working-directory: backend
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.1"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          JAR_NAME=$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "📦 版本: $VERSION"
          echo "📦 JAR: $JAR_NAME"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashi-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  # ===========================================================================
  # Build DEB packages for each architecture
  # ===========================================================================
  build-deb:
    name: Build DEB (${{ matrix.arch }})
    needs: build-jar
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            jdk_arch: x64
          - arch: arm64
            platform: linux/arm64
            jdk_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: hashi-jar
          path: backend/build/libs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build DEB in Docker (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}/backend:/workspace \
            -w /workspace \
            ubuntu:24.04 bash -c "
              set -e
              echo '📦 Installing dependencies...'
              apt-get update
              apt-get install -y wget binutils fakeroot

              echo '📦 Installing JDK 21 for ${{ matrix.arch }}...'
              wget -q https://download.oracle.com/java/21/latest/jdk-21_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              tar xzf jdk-21_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              export JAVA_HOME=\$(pwd)/jdk-21.*
              export PATH=\$JAVA_HOME/bin:\$PATH

              echo '📦 Packaging with jpackage...'
              mkdir -p output
              JAR_NAME=\$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)

              \$JAVA_HOME/bin/jpackage \\
                --verbose \\
                --name hashi-backend \\
                --app-version '${{ needs.build-jar.outputs.version }}' \\
                --type deb \\
                --input build/libs \\
                --main-jar \"\$JAR_NAME\" \\
                --main-class 'org.springframework.boot.loader.launch.JarLauncher' \\
                --java-options '-Djava.library.path=/usr/lib/jni' \\
                --arguments '--spring.profiles.active=prod' \\
                --linux-deb-maintainer 'koukeneko@dev' \\
                --linux-package-deps 'libvirt-clients, libvirt-daemon-system, iptables, docker.io, sudo' \\
                --resource-dir 'packaging/linux' \\
                --dest output

              echo '📦 Done!'
              ls -la output/
            "

      - name: Verify package
        run: |
          PKG_FILE=$(ls backend/output/*.deb | head -n 1)
          echo "📦 產生的套件: $PKG_FILE"
          dpkg-deb --info "$PKG_FILE"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashi-backend-${{ needs.build-jar.outputs.version }}-deb-${{ matrix.arch }}
          path: backend/output/*.deb
          retention-days: 30

  # ===========================================================================
  # Publish to APT Repository (only for tag or manual dispatch)
  # ===========================================================================
  publish-to-apt-repo:
    name: Publish to APT Repository
    needs: [build-jar, build-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout apt-repo
        uses: actions/checkout@v4
        with:
          repository: KoukeNeko/apt-repo
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo

      - name: Download all DEB artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hashi-backend-*-deb-*
          path: ./incoming
          merge-multiple: true

      - name: Move packages to pool
        run: |
          mkdir -p apt-repo/pool/main
          find ./incoming -name "*.deb" -exec mv {} apt-repo/pool/main/ \;
          ls -la apt-repo/pool/main/

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Update repository index
        working-directory: apt-repo
        run: |
          chmod +x scripts/update-repo.sh
          ./scripts/update-repo.sh

      - name: Commit and push
        working-directory: apt-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "📦 Add hashi-backend ${{ needs.build-jar.outputs.version }} (amd64 + arm64)" || echo "No changes"
          git push
