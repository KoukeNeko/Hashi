# ==============================================================================
# Hashi Backend - Build Linux Packages
# ==============================================================================
# 自動建置 Linux 安裝包 (DEB + RPM) 的 GitHub Actions workflow
# 支援架構：amd64, arm64
# 觸發條件：push 到任何分支、tag、手動觸發
# ==============================================================================

name: Build Linux Packages

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
    paths:
      - "backend/**"
      - ".github/workflows/build-deb.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版本號 (例如: 1.0.0)"
        required: false
        default: "0.0.1"

jobs:
  # ===========================================================================
  # Build JAR (架構無關，只需建置一次)
  # ===========================================================================
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      jar_name: ${{ steps.prepare.outputs.jar_name }}
      suite: ${{ steps.prepare.outputs.suite }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          echo "📦 Frontend built successfully"

      - name: Copy Frontend to Backend
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/* backend/src/main/resources/static/
          echo "📦 Frontend copied to backend/src/main/resources/static/"
          ls -la backend/src/main/resources/static/

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build JAR with Gradle
        working-directory: backend
        run: ./gradlew clean bootJar

      - name: Determine version and JAR name
        id: prepare
        working-directory: backend
        run: |
          # 判斷版本號
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.1"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 判斷 Suite：tag → stable, beta 分支 → beta, 其他 → dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SUITE="stable"
          elif [[ "${GITHUB_REF}" == refs/heads/beta ]]; then
            SUITE="beta"
          else
            SUITE="dev"
          fi
          echo "suite=$SUITE" >> $GITHUB_OUTPUT

          JAR_NAME=$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "📦 版本: $VERSION"
          echo "📦 Suite: $SUITE"
          echo "📦 JAR: $JAR_NAME"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashi-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  # ===========================================================================
  # Build DEB packages for each architecture
  # ===========================================================================
  build-deb:
    name: Build DEB (${{ matrix.arch }})
    needs: build-jar
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            jdk_arch: x64
          - arch: arm64
            platform: linux/arm64
            jdk_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: hashi-jar
          path: backend/build/libs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build DEB in Docker (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}/backend:/workspace \
            -w /workspace \
            ubuntu:24.04 bash -c "
              set -e
              echo '📦 Installing dependencies...'
              apt-get update
              apt-get install -y wget binutils fakeroot

              echo '📦 Installing JDK 21 for ${{ matrix.arch }}...'
              wget -q https://download.oracle.com/java/21/latest/jdk-21_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              tar xzf jdk-21_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              export JAVA_HOME=\$(pwd)/jdk-21.*
              export PATH=\$JAVA_HOME/bin:\$PATH

              echo '📦 Packaging with jpackage...'
              mkdir -p output
              JAR_NAME=\$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)

              \$JAVA_HOME/bin/jpackage \\
                --verbose \\
                --name hashi \\
                --app-version '${{ needs.build-jar.outputs.version }}' \\
                --type deb \\
                --input build/libs \\
                --main-jar \"\$JAR_NAME\" \\
                --main-class 'org.springframework.boot.loader.launch.JarLauncher' \\
                --java-options '-Djava.library.path=/usr/lib/jni' \\
                --arguments '--spring.profiles.active=prod' \\
                --linux-deb-maintainer 'koukeneko@dev' \\
                --linux-package-deps 'libvirt-clients, libvirt-daemon-system, iptables, sudo' \\
                --resource-dir 'packaging/linux' \\
                --dest output

              echo '📦 Done!'
              ls -la output/
            "

      - name: Verify package
        run: |
          PKG_FILE=$(ls backend/output/*.deb | head -n 1)
          echo "📦 產生的套件: $PKG_FILE"
          dpkg-deb --info "$PKG_FILE"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashi-${{ needs.build-jar.outputs.version }}-deb-${{ matrix.arch }}
          path: backend/output/*.deb
          retention-days: 30

  # ===========================================================================
  # Build RPM packages for each architecture
  # ===========================================================================
  build-rpm:
    name: Build RPM (${{ matrix.arch }})
    needs: build-jar
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            jdk_arch: x64
          - arch: arm64
            platform: linux/arm64
            jdk_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: hashi-jar
          path: backend/build/libs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build RPM in Docker (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}/backend:/workspace \
            -w /workspace \
            fedora:40 bash -c "
              set -e
              echo '📦 Installing dependencies...'
              dnf install -y wget rpm-build

              echo '📦 Installing JDK 21 for ${{ matrix.arch }}...'
              wget -q https://download.oracle.com/java/21/latest/jdk-21_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              tar xzf jdk-21_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              export JAVA_HOME=\$(pwd)/jdk-21.*
              export PATH=\$JAVA_HOME/bin:\$PATH

              echo '📦 Packaging with jpackage...'
              mkdir -p output
              JAR_NAME=\$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)

              # RPM version cannot contain '-'
              VERSION='${{ needs.build-jar.outputs.version }}'
              VERSION=\${VERSION//-/\~}

              \$JAVA_HOME/bin/jpackage \\
                --verbose \\
                --name hashi \\
                --app-version \"\$VERSION\" \\
                --type rpm \\
                --input build/libs \\
                --main-jar \"\$JAR_NAME\" \\
                --main-class 'org.springframework.boot.loader.launch.JarLauncher' \\
                --java-options '-Djava.library.path=/usr/lib/jni' \\
                --arguments '--spring.profiles.active=prod' \\
                --linux-rpm-license-type MIT \\
                --dest output

              echo '📦 Done!'
              ls -la output/
            "

      - name: Verify package
        run: |
          PKG_FILE=$(ls backend/output/*.rpm | head -n 1)
          echo "📦 產生的套件: $PKG_FILE"
          rpm -qip "$PKG_FILE" 2>/dev/null || echo "Cannot read RPM info on Ubuntu"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashi-${{ needs.build-jar.outputs.version }}-rpm-${{ matrix.arch }}
          path: backend/output/*.rpm
          retention-days: 30

  # ===========================================================================
  # Publish to Package Repository (only for tag or manual dispatch)
  # ===========================================================================
  publish-to-pkg-repo:
    name: Publish to Package Repository
    needs: [build-jar, build-deb, build-rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout pkg-repo
        uses: actions/checkout@v4
        with:
          repository: KoukeNeko/pkg-repo
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: pkg-repo

      - name: Download all DEB artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hashi-*-deb-*
          path: ./incoming-deb
          merge-multiple: true

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hashi-*-rpm-*
          path: ./incoming-rpm
          merge-multiple: true

      - name: Move DEB packages
        run: |
          SUITE="${{ needs.build-jar.outputs.suite }}"
          mkdir -p pkg-repo/apt/pool/$SUITE
          find ./incoming-deb -name "*.deb" -exec mv {} pkg-repo/apt/pool/$SUITE/ \; 2>/dev/null || true
          echo "📦 DEB packages ($SUITE):"
          ls -la pkg-repo/apt/pool/$SUITE/ 2>/dev/null || echo "No DEB packages"

      - name: Move RPM packages
        run: |
          mkdir -p pkg-repo/rpm/packages
          find ./incoming-rpm -name "*.rpm" -exec mv {} pkg-repo/rpm/packages/ \; 2>/dev/null || true
          echo "📦 RPM packages:"
          ls -la pkg-repo/rpm/packages/ 2>/dev/null || echo "No RPM packages"

      - name: Install createrepo
        run: sudo apt-get update && sudo apt-get install -y createrepo-c

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Update repository index
        working-directory: pkg-repo
        run: |
          chmod +x scripts/update-repo.sh
          ./scripts/update-repo.sh

      - name: Commit and push
        working-directory: pkg-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "📦 Add hashi ${{ needs.build-jar.outputs.version }} to ${{ needs.build-jar.outputs.suite }} (DEB + RPM, amd64 + arm64)" || echo "No changes"
          git push

