# ==============================================================================
# Hashi Backend - Build Linux Packages
# ==============================================================================
# 自動建置 Linux 安裝包 (DEB + RPM) 的 GitHub Actions workflow
# 觸發條件：push 到任何分支、手動觸發
# ==============================================================================

name: Build Linux Packages

on:
  push:
    branches:
      - "*"
    paths:
      - "backend/**"
      - ".github/workflows/build-deb.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版本號 (例如: 1.0.0)"
        required: false
        default: "0.0.1"

jobs:
  build-package:
    name: Build ${{ matrix.type }} Package
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - type: deb
            deps: binutils fakeroot
            extension: deb
          - type: rpm
            deps: rpm-build
            extension: rpm

    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout 程式碼
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # 2. 安裝系統打包依賴
      # -------------------------------------------------------------------------
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      # -------------------------------------------------------------------------
      # 3. 設定 JDK 25
      # -------------------------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "25"

      # -------------------------------------------------------------------------
      # 4. 設定 Gradle (含快取)
      # -------------------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # -------------------------------------------------------------------------
      # 5. Gradle 建置 JAR
      # -------------------------------------------------------------------------
      - name: Build JAR with Gradle
        working-directory: backend
        run: ./gradlew clean bootJar

      # -------------------------------------------------------------------------
      # 6. 確定版本號與 JAR 檔名
      # -------------------------------------------------------------------------
      - name: Determine version and JAR name
        id: prepare
        working-directory: backend
        run: |
          # 版本號優先順序：手動輸入 > tag > 預設值
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.1-SNAPSHOT"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 取得 JAR 檔名
          JAR_NAME=$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "📦 版本: $VERSION"
          echo "📦 JAR: $JAR_NAME"

      # -------------------------------------------------------------------------
      # 7. 使用 jpackage 打包
      # -------------------------------------------------------------------------
      - name: Package with jpackage (${{ matrix.type }})
        working-directory: backend
        run: |
          mkdir -p output

          # 根據套件類型設定額外參數
          EXTRA_ARGS=""
          if [ "${{ matrix.type }}" = "deb" ]; then
            EXTRA_ARGS="--linux-deb-maintainer koukeneko@dev"
          elif [ "${{ matrix.type }}" = "rpm" ]; then
            EXTRA_ARGS="--linux-rpm-license-type MIT"
          fi

          jpackage \
            --verbose \
            --name hashi-backend \
            --app-version "${{ steps.prepare.outputs.version }}" \
            --type ${{ matrix.type }} \
            --input build/libs \
            --main-jar "${{ steps.prepare.outputs.jar_name }}" \
            --main-class "org.springframework.boot.loader.launch.JarLauncher" \
            --java-options "-Djava.library.path=/usr/lib/jni" \
            --arguments "--spring.profiles.active=prod" \
            --linux-package-deps "libvirt-clients, libvirt-daemon-system, iptables, docker.io, sudo" \
            --resource-dir "packaging/linux" \
            --dest output \
            $EXTRA_ARGS

      # -------------------------------------------------------------------------
      # 8. 驗證套件並顯示資訊
      # -------------------------------------------------------------------------
      - name: Verify package
        working-directory: backend
        run: |
          PKG_FILE=$(ls output/*.${{ matrix.extension }} | head -n 1)
          echo "📦 產生的套件: $PKG_FILE"
          echo ""
          echo "=== 套件資訊 ==="
          if [ "${{ matrix.type }}" = "deb" ]; then
            dpkg-deb --info "$PKG_FILE"
            echo ""
            echo "=== 套件內容 ==="
            dpkg-deb --contents "$PKG_FILE" | head -50
          elif [ "${{ matrix.type }}" = "rpm" ]; then
            rpm -qip "$PKG_FILE"
            echo ""
            echo "=== 套件內容 ==="
            rpm -qlp "$PKG_FILE" | head -50
          fi

      # -------------------------------------------------------------------------
      # 9. 上傳套件作為 Artifact
      # -------------------------------------------------------------------------
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashi-backend-${{ steps.prepare.outputs.version }}-${{ matrix.type }}
          path: backend/output/*.${{ matrix.extension }}
          retention-days: 30
