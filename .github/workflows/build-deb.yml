# ==============================================================================
# Hashi Backend - Build Linux Packages
# ==============================================================================
# 自動建置 Linux 安裝包 (DEB + RPM) 的 GitHub Actions workflow
# 支援架構：amd64, arm64
# 觸發條件：push 到任何分支、tag、手動觸發
# ==============================================================================

name: Build Linux Packages

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-deb.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版本 (例如: 1.0.0)"
        required: false
        default: "0.0.1"

jobs:
  # ===========================================================================
  # Build JAR (架構無關，只需建置一次)
  # ===========================================================================
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      jar_name: ${{ steps.prepare.outputs.jar_name }}
      pkg_name: ${{ steps.prepare.outputs.pkg_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          echo "📦 Frontend built successfully"

      - name: Copy Frontend to Backend
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/* backend/src/main/resources/static/
          echo "📦 Frontend copied to backend/src/main/resources/static/"
          ls -la backend/src/main/resources/static/

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build JAR with Gradle
        working-directory: backend
        run: ./gradlew clean bootJar

      - name: Determine version and JAR name
        id: prepare
        working-directory: backend
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # 取得最近的 tag 版本號
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LATEST_TAG=$(git describe --tags --abbrev=0)
            BASE_VERSION="${LATEST_TAG#v}"
            COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG}..HEAD)
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}+${SHORT_SHA}"
          else
            # 沒找到 tag，使用預設版本 0.0.1 並計算所有 commits
            BASE_VERSION="0.0.1"
            COMMIT_COUNT=$(git rev-list --count HEAD)
            # 使用 0.0.1.commit_count+short_sha 格式
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}+${SHORT_SHA}"
          fi

          # 版本號
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 正式 tag release：使用 tag 版本
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # dev/beta builds：使用 基礎版本.commit數量 格式
            # 例如：0.0.1.5 表示比 0.0.1 新 5 個 commits
            # APT 會正確排序 0.0.1.5 > 0.0.1.4 > 0.0.1
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          fi

          # 根據來源決定套件名稱
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PKG_NAME="hashi"
            CHANNEL="stable"
          elif [[ "${GITHUB_REF}" == refs/heads/beta ]]; then
            PKG_NAME="hashi-beta"
            CHANNEL="beta"
          else
            PKG_NAME="hashi-dev"
            CHANNEL="dev"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT

          JAR_NAME=$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "📦 套件: $PKG_NAME"
          echo "📦 版本: $VERSION ($CHANNEL)"
          echo "📦 JAR: $JAR_NAME"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashi-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  # ===========================================================================
  # Build DEB packages for each architecture
  # ===========================================================================
  build-deb:
    name: Build DEB (${{ matrix.arch }})
    needs: build-jar
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            jdk_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            jdk_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: hashi-jar
          path: backend/build/libs



      - name: Build DEB in Docker (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}/backend:/workspace \
            -w /workspace \
            ubuntu:24.04 bash -c "
              set -e
              echo '📦 Installing dependencies...'
              apt-get update
              apt-get install -y wget binutils fakeroot

              echo '📦 Installing JDK 25 for ${{ matrix.arch }}...'
              wget -q https://download.oracle.com/java/25/latest/jdk-25_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              tar xzf jdk-25_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              export JAVA_HOME=\$(pwd)/jdk-25.*
              export PATH=\$JAVA_HOME/bin:\$PATH

              echo '📦 Packaging with jpackage...'
              mkdir -p output
              JAR_NAME=\$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)

              \$JAVA_HOME/bin/jpackage \\
                --verbose \\
                --name '${{ needs.build-jar.outputs.pkg_name }}' \\
                --app-version '${{ needs.build-jar.outputs.version }}' \\
                --type deb \\
                --input build/libs \\
                --main-jar \"\$JAR_NAME\" \\
                --main-class 'org.springframework.boot.loader.launch.JarLauncher' \\
                --java-options '-Djava.library.path=/usr/lib/jni' \\
                --arguments '--spring.profiles.active=prod' \\
                --linux-deb-maintainer 'koukeneko@dev' \\
                --linux-package-deps 'libvirt-clients, libvirt-daemon-system, iptables, sudo' \\
                --resource-dir 'packaging/linux' \\
                --dest output

              echo '📦 Done!'
              ls -la output/
            "

      - name: Verify package
        run: |
          PKG_FILE=$(ls backend/output/*.deb | head -n 1)
          echo "📦 產生的套件: $PKG_FILE"
          dpkg-deb --info "$PKG_FILE"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.build-jar.outputs.pkg_name }}-${{ needs.build-jar.outputs.version }}-deb-${{ matrix.arch }}
          path: backend/output/*.deb
          retention-days: 30

  # ===========================================================================
  # Build RPM packages for each architecture
  # ===========================================================================
  build-rpm:
    name: Build RPM (${{ matrix.arch }})
    needs: build-jar
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            jdk_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            jdk_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: hashi-jar
          path: backend/build/libs



      - name: Build RPM in Docker (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}/backend:/workspace \
            -w /workspace \
            fedora:40 bash -c "
              set -e
              echo '📦 Installing dependencies...'
              dnf install -y wget rpm-build

              echo '📦 Installing JDK 25 for ${{ matrix.arch }}...'
              wget -q https://download.oracle.com/java/25/latest/jdk-25_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              tar xzf jdk-25_linux-${{ matrix.jdk_arch }}_bin.tar.gz
              export JAVA_HOME=\$(pwd)/jdk-25.*
              export PATH=\$JAVA_HOME/bin:\$PATH

              echo '📦 Packaging with jpackage...'
              mkdir -p output
              JAR_NAME=\$(ls build/libs/hashi-*.jar | head -n 1 | xargs basename)

              # RPM version cannot contain '-'
              VERSION='${{ needs.build-jar.outputs.version }}'
              VERSION=\${VERSION//-/\~}

              \$JAVA_HOME/bin/jpackage \\
                --verbose \\
                --name '${{ needs.build-jar.outputs.pkg_name }}' \\
                --app-version \"\$VERSION\" \\
                --type rpm \\
                --input build/libs \\
                --main-jar \"\$JAR_NAME\" \\
                --main-class 'org.springframework.boot.loader.launch.JarLauncher' \\
                --java-options '-Djava.library.path=/usr/lib/jni' \\
                --arguments '--spring.profiles.active=prod' \\
                --linux-rpm-license-type MIT \\
                --dest output

              echo '📦 Done!'
              ls -la output/
            "

      - name: Verify package
        run: |
          PKG_FILE=$(ls backend/output/*.rpm | head -n 1)
          echo "📦 產生的套件: $PKG_FILE"
          rpm -qip "$PKG_FILE" 2>/dev/null || echo "Cannot read RPM info on Ubuntu"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.build-jar.outputs.pkg_name }}-${{ needs.build-jar.outputs.version }}-rpm-${{ matrix.arch }}
          path: backend/output/*.rpm
          retention-days: 30

  # ===========================================================================
  # Publish to Package Repository
  # ===========================================================================
  publish-to-pkg-repo:
    name: Publish to Package Repository
    needs: [build-jar, build-deb, build-rpm]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pkg-repo
        uses: actions/checkout@v4
        with:
          repository: KoukeNeko/pkg-repo
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: pkg-repo

      - name: Download all DEB artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hashi-*-deb-*
          path: ./incoming-deb
          merge-multiple: true

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hashi-*-rpm-*
          path: ./incoming-rpm
          merge-multiple: true

      - name: Move DEB packages
        run: |
          mkdir -p pkg-repo/apt/pool/stable/hashi
          find ./incoming-deb -name "*.deb" -exec cp -f {} pkg-repo/apt/pool/stable/hashi/ \; 2>/dev/null || true
          echo "📦 DEB packages:"
          ls -la pkg-repo/apt/pool/stable/hashi/ 2>/dev/null || echo "No DEB packages"

      - name: Move RPM packages
        run: |
          mkdir -p pkg-repo/rpm/packages/hashi
          find ./incoming-rpm -name "*.rpm" -exec cp -f {} pkg-repo/rpm/packages/hashi/ \; 2>/dev/null || true
          echo "📦 RPM packages:"
          ls -la pkg-repo/rpm/packages/hashi/ 2>/dev/null || echo "No RPM packages"

      - name: Install createrepo
        run: sudo apt-get update && sudo apt-get install -y createrepo-c

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Update repository index
        working-directory: pkg-repo
        run: |
          chmod +x scripts/update-repo.sh
          ./scripts/update-repo.sh

      - name: Commit and push
        working-directory: pkg-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          COMMIT_MSG="📦 Add ${{ needs.build-jar.outputs.pkg_name }} ${{ needs.build-jar.outputs.version }} (DEB + RPM, amd64 + arm64)"
          MAX_RETRIES=3
          ATTEMPT=1
          
          while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do
            git add .
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
          
            git commit -m "$COMMIT_MSG"
          
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $ATTEMPT"
              exit 0
            fi
          
            if [ "$ATTEMPT" -ge "$MAX_RETRIES" ]; then
              echo "Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
          
            echo "Push rejected due remote updates. Re-sync and regenerate indexes (attempt $ATTEMPT/$MAX_RETRIES)"
            ATTEMPT=$((ATTEMPT + 1))
          
            git fetch origin main
            git reset --hard origin/main
          
            mkdir -p apt/pool/stable/hashi
            mkdir -p rpm/packages/hashi
            find ../incoming-deb -name "*.deb" -exec cp -f {} apt/pool/stable/hashi/ \; 2>/dev/null || true
            find ../incoming-rpm -name "*.rpm" -exec cp -f {} rpm/packages/hashi/ \; 2>/dev/null || true
          
            chmod +x scripts/update-repo.sh
            ./scripts/update-repo.sh
          done
