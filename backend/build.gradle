plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.koukeneko'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
//    加入 JetBrains 官方依賴庫，這裡才有完整的 Pty4J 和它的快樂夥伴
    maven { url "https://packages.jetbrains.team/maven/p/ij/intellij-dependencies"}
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    implementation 'com.github.oshi:oshi-core:6.9.1'
    implementation 'com.github.docker-java:docker-java-core:3.7.0'
    implementation 'com.github.docker-java:docker-java-api:3.7.0'
    implementation 'com.github.docker-java:docker-java-transport-httpclient5:3.7.0'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // PTY 支援 (模擬終端機核心)
    implementation 'org.jetbrains.pty4j:pty4j:0.12.13'
    implementation 'org.jetbrains.pty4j:purejavacomm:0.0.11.1'

    // KVM / Libvirt 綁定庫
    implementation 'org.libvirt:libvirt:0.5.2'
    implementation 'net.java.dev.jna:jna:5.13.0'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
